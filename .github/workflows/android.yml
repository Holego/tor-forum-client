name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the APKs
        type: boolean
        default: false
      version:
        description: Release tag to create, e.g. v0.1.0
        type: string
        default: v0.1.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLET_CLI_NO_RICH_OUTPUT: "1"
      PYTHONIOENCODING: utf-8
      # Optional: a stable signing key, so new versions install over old ones.
      # Without it every build is signed with a throwaway debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Flet builds with JDK 17 (the last one listed becomes JAVA_HOME); JDK 21 is the Gradle
      # toolchain for the flet_tor module, found through JAVA_HOME_21_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Flet CLI
        run: uv sync --locked --no-default-groups --group dev

      - name: Decode signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: uv run --no-sync flet build apk --yes --verbose --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tor-forum-apk
          path: build/apk/*.apk
          if-no-files-found: error

  emulator:
    # Boot the x86_64 APK on an Android emulator and check the built-in Tor really connects.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tor-forum-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app and wait for Tor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/emulator-smoke-test.sh apk/tor-forum-client-x86_64.apk

  release:
    # On a pushed v* tag, or from "Run workflow" with "Publish a GitHub release" ticked.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [apk, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the workspace, which would delete an artifact downloaded before it.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: tor-forum-apk
          path: apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Tor Forum ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: apk/*.apk
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: true
