name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write  # attach APKs to the GitHub release on version tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLET_CLI_NO_RICH_OUTPUT: "1"
      PYTHONIOENCODING: utf-8
      # Optional: a stable signing key, so new versions install over old ones.
      # Without it every build is signed with a throwaway debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Flet CLI
        run: uv sync --locked --no-default-groups --group dev

      - name: Decode signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: uv run --no-sync flet build apk --yes --verbose --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tor-forum-apk
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
          generate_release_notes: true
