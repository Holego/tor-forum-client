name: flet_tor
description: Embedded Tor for Flet apps on Android
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flet: 1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.github.holego.flet_tor
        pluginClass: FletTorPlugin
