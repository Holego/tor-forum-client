[project]
name = "flet-tor"
version = "0.1.0"
description = "Embedded Tor for Flet apps on Android (tor-android + Snowflake/obfs4/WebTunnel bridges via IPtProxy)"
authors = [{ name = "Holego" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["flet>=1.0.1"]

[tool.setuptools.package-data]
"flutter.flet_tor" = [
    "pubspec.yaml",
    "lib/**",
    "android/**",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
